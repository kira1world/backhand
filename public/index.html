<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness AI Planner</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 400px;
  margin: auto;
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
}

input, select, button, textarea {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#chatBox {
  background: #020617;
  padding: 10px;
  height: 150px;
  overflow-y: auto;
  border-radius: 8px;
}

.hidden {
  display: none;
}
</style>

</head>
<body>

<div class="container">
<h1>🏋️ Fitness AI Planner</h1>

<form id="form">
<input type="number" id="age" placeholder="Age" required>
<input type="number" id="weight" placeholder="Weight (kg)" required>
<input type="number" id="height" placeholder="Height (cm)" required>

<select id="activity">
<option value="low">Low Activity</option>
<option value="moderate">Moderate</option>
<option value="high">High</option>
</select>

<select id="goal">
<option value="fat_loss">Fat Loss</option>
<option value="muscle_gain">Muscle Gain</option>
</select>

<select id="diet">
<option value="veg">Vegetarian</option>
<option value="nonveg">Non-Veg</option>
</select>

<button type="submit">Generate Plan</button>
</form>

<div id="result" class="hidden">
<h2>Your Plan</h2>
<p>Calories: <span id="calories"></span></p>
<p>Protein: <span id="protein"></span> g</p>

<h3>Workout</h3>
<ul id="workout"></ul>

<h3>Meals</h3>
<ul id="meals"></ul>
</div>

<hr>

<h2>📊 Progress</h2>
<input type="number" id="currentWeight" placeholder="Today's Weight">
<button onclick="saveProgress()">Save</button>
<ul id="progressList"></ul>

<hr>

<h2>📝 Daily Log</h2>
<textarea id="logText" placeholder="Write your day..."></textarea>
<button onclick="saveLog()">Save Log</button>
<ul id="logList"></ul>

<hr>

<h2>🤖 AI Coach</h2>
<input type="text" id="chatInput" placeholder="Ask...">
<button onclick="sendMessage()">Send</button>
<div id="chatBox"></div>

</div>

<script>
// FORM LOGIC
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  let age = ageInput("age");
  let weight = ageInput("weight");
  let height = ageInput("height");
  let activity = val("activity");
  let goal = val("goal");
  let diet = val("diet");

  let bmr = (10*weight)+(6.25*height)-(5*age)+5;

  let map = {low:1.2, moderate:1.55, high:1.725};
  let calories = bmr * map[activity];

  if(goal==="fat_loss") calories-=400;
  if(goal==="muscle_gain") calories+=300;

  let protein = goal==="fat_loss" ? weight*2 : weight*1.6;

  let workout = goal==="fat_loss"
    ? ["Running","HIIT","Full Body"]
    : ["Push","Pull","Legs"];

  let meals = diet==="veg"
    ? ["Paneer","Dal","Roti","Curd"]
    : ["Chicken","Eggs","Rice","Fish"];

  setText("calories", Math.round(calories));
  setText("protein", protein);

  fillList("workout", workout);
  fillList("meals", meals);

  document.getElementById("result").classList.remove("hidden");
});

function ageInput(id){ return parseInt(document.getElementById(id).value); }
function val(id){ return document.getElementById(id).value; }
function setText(id, val){ document.getElementById(id).innerText = val; }

function fillList(id, arr){
  let el = document.getElementById(id);
  el.innerHTML="";
  arr.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x;
    el.appendChild(li);
  });
}

// PROGRESS
function saveProgress(){
  let w = val("currentWeight");
  if(!w) return;

  let data = JSON.parse(localStorage.getItem("progress"))||[];
  data.push({w, date:new Date().toLocaleDateString()});
  localStorage.setItem("progress", JSON.stringify(data));
  showProgress();
}

function showProgress(){
  let list=document.getElementById("progressList");
  list.innerHTML="";
  let data=JSON.parse(localStorage.getItem("progress"))||[];
  data.forEach(d=>{
    let li=document.createElement("li");
    li.innerText=`${d.date} - ${d.w}kg`;
    list.appendChild(li);
  });
}
showProgress();

// LOG
function saveLog(){
  let text = val("logText");
  if(!text) return;

  let logs = JSON.parse(localStorage.getItem("logs"))||[];
  logs.push({text, date:new Date().toLocaleDateString()});
  localStorage.setItem("logs", JSON.stringify(logs));
  showLogs();
}

function showLogs(){
  let list=document.getElementById("logList");
  list.innerHTML="";
  let logs=JSON.parse(localStorage.getItem("logs"))||[];
  logs.forEach(l=>{
    let li=document.createElement("li");
    li.innerText=`${l.date} - ${l.text}`;
    list.appendChild(li);
  });
}
showLogs();

// CHATBOT
async function sendMessage() {
  let input = document.getElementById("chatInput").value;
  if (!input) return;

  let box = document.getElementById("chatBox");

  box.innerHTML += `<p>You: ${input}</p>`;

  const res = await fetch("http://localhost:3000/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: input })
  });

  const data = await res.json();

  box.innerHTML += `<p>Coach: ${data.reply}</p>`;

  document.getElementById("chatInput").value = "";
}

function bot(msg){
  msg=msg.toLowerCase();
  if(msg.includes("protein")) return "Take 1.6–2g/kg protein 💪";
  if(msg.includes("fat")) return "Calorie deficit + cardio 🔥";
  if(msg.includes("muscle")) return "Lift heavy + sleep 🏋️";
  if(msg.includes("diet")) return "Eat clean Indian foods 🍛";
  return "Stay consistent 💯";
}
</script>

</body>
</html>>
